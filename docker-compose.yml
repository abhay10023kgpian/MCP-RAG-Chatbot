version: "3.8"

services:
  # ─── Backend: FastAPI + MCP Servers (stdio subprocesses) ───
  api:
    build: .
    container_name: mcp-rag-api
    command: python start.py
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - API_HOST=0.0.0.0
    volumes:
      # Mount storage for live doc updates without rebuild
      - ./storage:/app/storage
      # Persist chroma_db across container restarts (unlike Render)
      - chroma_data:/app/chroma_db
    restart: unless-stopped

  # ─── Frontend: Streamlit Chat UI ───
  frontend:
    build: .
    container_name: mcp-rag-frontend
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mcp-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:16
    container_name: mcp-rag-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
      - POSTGRES_DB=${POSTGRES_DB:-chatbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chroma_data:
    # Named volume persists chroma_db across container restarts
  redis_data:
    # Named volume persists Redis data across container restarts
  postgres_data:
    # Named volume persists Postgres data across container restarts
